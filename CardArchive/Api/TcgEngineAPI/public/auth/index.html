<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Card Archive 관리자</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 로그인 화면 -->
    <section id="login-view" class="hidden">
        <form id="login-form" class="login-card">
            <h1>Card Archive 관리자</h1>
            <p class="login-desc">관리자(root) 계정으로 로그인하세요.</p>
            <input id="login-username" type="text" placeholder="유저명" autocomplete="username" required>
            <input id="login-password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
            <button type="submit" id="login-button">로그인</button>
            <div id="login-error" class="error-msg"></div>
        </form>
    </section>

    <!-- 대시보드 화면 -->
    <section id="dashboard-view" class="hidden">
        <header class="topbar">
            <div class="topbar-title">Card Archive 통계</div>
            <div class="topbar-right">
                <span id="admin-name"></span>
                <button id="logout-button">로그아웃</button>
            </div>
        </header>

        <div class="layout">
            <nav id="stat-menu" class="side-menu"></nav>

            <main class="content">
                <div class="content-header">
                    <h2 id="stat-title"></h2>
                    <div class="content-tools">
                        <input id="table-filter" type="text" placeholder="검색...">
                        <button id="refresh-button">새로고침</button>
                    </div>
                </div>
                <div id="stat-info" class="stat-info"></div>
                <div id="stat-error" class="error-msg"></div>
                <div class="table-wrap">
                    <table id="stat-table"></table>
                </div>
            </main>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
